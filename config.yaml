# Agent 工具调用平台 - 配置文件

# 模型提供商配置
providers:
  deepseek:
    api_key: "REDACTED_DEEPSEEK_KEY"
    base_url: "https://api.deepseek.com"
    models:
      - "deepseek-chat"
      - "deepseek-v4-flash"
      - "deepseek-v4-pro"

  openrouter:
    api_key: ""  # 填入你的 OpenRouter API Key
    base_url: "https://openrouter.ai/api/v1"
    models:
      - "google/gemini-2.0-flash-001"

  # 本地模型（vLLM / llama.cpp 等）
  # local:
  #   api_key: "EMPTY"
  #   base_url: "http://localhost:8000"
  #   models:
  #     - "default"

# 默认模型
default_model: "deepseek-chat"

# 数据库配置
database:
  path: "data/agent.db"

# Web 服务配置
server:
  host: "0.0.0.0"
  port: 10004

# Agent 配置
agent:
  max_steps: 10          # 最大推理步数
  max_tokens: 4096       # 最大输出 Token
  temperature: 0.7       # 温度
  system_prompt: "你是一个智能助手，可以通过调用工具来完成用户的任务。先理解用户意图，再选择合适的工具。"
